name: Semantic Release

permissions:
    contents: write
    issues: write
    pull-requests: write

on:
    push:
        branches:
            - master
        # Pushes that only touch docs, tests or tooling cannot ship code; the next releasable push picks their commits up.
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'LICENSE'
            - 'tests/**'
            - 'tools/**'
            - '.cursor/**'
            - '.vscode/**'
    workflow_dispatch:

jobs:
    main:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # `prepare` installs Git hooks on install. semantic-release commits and pushes, so keep them out.
        env:
            VP_GIT_HOOKS: '0'
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
