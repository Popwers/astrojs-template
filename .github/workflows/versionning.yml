name: Semantic Release

permissions:
    contents: write
    issues: write
    pull-requests: write

on:
    push:
        branches:
            - master
        # Pushes that only touch docs, tests or tooling cannot ship code; the next releasable push picks their commits up.
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'LICENSE'
            - 'tests/**'
            - 'tools/**'
            - '.cursor/**'
            - '.vscode/**'
    workflow_dispatch:

jobs:
    main:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
