name: Semantic Release

permissions:
    contents: write
    issues: write
    pull-requests: write

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    main:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
