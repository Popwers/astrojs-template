name: CI

# Pull requests only: main re-ran the suites the PR had just passed. Client repos generated from this template do the same.
on:
    pull_request:
        # Docs-only PRs skip CI: nothing they touch is built or tested. Re-include any markdown the build reads.
        paths:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'

# A new push to a PR supersedes the run in flight.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Astro types
              run: bunx astro sync
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Lint, format and typecheck
              run: bunx vp check

            - name: Astro typecheck
              run: bunx astro check
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Tests
              run: bunx vp test

            - name: Test portability guard
              run: bash scripts/check-test-portability.sh

            - name: Build
              run: bun run build
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            # Installs Vite+, the latest LTS Node (e2e needs Node >= 24.8), bun from `packageManager`, and the dependencies.
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            # The Chromium build of the playwright-core that @e2e-dev/web pins, plus its system libraries.
            - name: Install Chromium
              run: vpx @e2e-dev/web install chromium --with-deps

            # e2e starts tests/e2e/serve.sh (stub Strapi + built app). The `agent`-tagged test needs a model login CI does not have.
            - name: e2e golden paths
              run: vp run test:e2e:ci

            - name: Upload e2e report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report
                  path: |
                      .e2e/report.json
                      .e2e/junit.xml
                      .e2e/artifacts/
                      .e2e/logs/
                  if-no-files-found: warn
                  retention-days: 7
