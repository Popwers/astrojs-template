name: CI

on:
    pull_request:
    push:
        branches:
            - master

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Astro types
              run: bunx astro sync
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Lint, format and typecheck
              run: bunx vp check

            - name: Astro typecheck
              run: bunx astro check
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Tests
              run: bunx vp test

            - name: Test portability guard
              run: bash scripts/check-test-portability.sh

            - name: Build
              run: bun run build
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            # Playwright builds the app and starts it next to the stub Strapi in tests/e2e.
            - name: Playwright golden paths
              run: bun run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
