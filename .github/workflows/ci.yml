name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint, format and typecheck
              run: bunx vp check

            - name: Astro typecheck
              run: bunx astro check
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Tests
              run: bun test

            - name: Test portability guard
              run: bash scripts/check-test-portability.sh

            - name: Build
              run: bun run build
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret
