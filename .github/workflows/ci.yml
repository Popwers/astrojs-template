name: CI

# Pull requests run the suites; main does not re-run what the PR just passed. Client repos generated from this template do the same.
on:
    pull_request:
        # Docs-only PRs skip CI: nothing they touch is built or tested. Re-include any markdown the build reads.
        paths:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'
    # Master only seeds the dependency and browser caches: a PR reads master's caches, never another PR's.
    push:
        branches:
            - master
        paths:
            - 'bun.lock'
            - 'package.json'
            - '.github/workflows/ci.yml'

# A new push to a PR supersedes the run in flight.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Astro types
              run: bunx astro sync
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Lint, format and typecheck
              run: bunx vp check

            - name: Astro typecheck
              run: bunx astro check
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

            - name: Tests
              run: bunx vp test

            - name: Test portability guard
              run: bash scripts/check-test-portability.sh

            - name: Build
              run: bun run build
              env:
                  STRAPI_URL: http://localhost:1337
                  STRAPI_TOKEN: ci-dummy-token
                  COOKIE_SIGNING_SECRET: ci-cookie-signing-secret

    # The e2e suite only runs when the PR touches the app, its dependencies, the suite or this workflow.
    changes:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: read
        outputs:
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      e2e:
                          - 'src/**'
                          - 'public/**'
                          - 'tests/e2e/**'
                          - 'e2e.config.ts'
                          - 'astro.config.mjs'
                          - 'vite.config.ts'
                          - 'tsconfig.json'
                          - 'pwa-assets.config.ts'
                          - 'sentry.*.js'
                          - 'start.mjs'
                          - 'package.json'
                          - 'bun.lock'
                          - '.github/workflows/ci.yml'

    e2e-shard:
        name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
        needs: changes
        if: needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            # Two slices: the two consent tests (4 s banner delay each) stay in one and bound it whatever the count.
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4

            # Installs Vite+, the latest LTS Node (e2e needs Node >= 24.8), bun from `packageManager`, and the dependencies.
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            # Ports derive from the run and the shard, so shards of several runs can share one self-hosted host.
            - name: Shard ports
              run: |
                  offset=$(( (GITHUB_RUN_ID % 1000) * ${{ strategy.job-total }} + ${{ matrix.shard }} - 1 ))
                  echo "E2E_APP_PORT=$(( 20000 + offset ))" >> "$GITHUB_ENV"
                  echo "E2E_STRAPI_STUB_PORT=$(( 23000 + offset ))" >> "$GITHUB_ENV"

            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(jq -r .version node_modules/playwright-core/package.json)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

            # Headless runs launch the Chromium headless shell only; the runner image already ships its system libraries.
            - name: Install Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: bunx playwright-core install --with-deps --only-shell chromium

            # e2e starts tests/e2e/serve.sh (stub Strapi + built app). The `agent`-tagged test needs a model login CI does not have.
            - name: e2e golden paths
              run: vp run test:e2e:ci --shard ${{ matrix.shard }}/${{ strategy.job-total }}

            - name: Upload e2e report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report-${{ matrix.shard }}
                  include-hidden-files: true
                  path: |
                      .e2e/report.json
                      .e2e/junit.xml
                      .e2e/artifacts/
                      .e2e/logs/
                  if-no-files-found: warn
                  retention-days: 7

    # Keeps the historical `e2e` check: green when the shards pass or the PR touches nothing they test.
    e2e:
        needs: [changes, e2e-shard]
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: e2e result
              env:
                  CHANGES: ${{ needs.changes.result }}
                  RUN_E2E: ${{ needs.changes.outputs.e2e }}
                  SHARDS: ${{ needs.e2e-shard.result }}
              run: |
                  echo "changes=$CHANGES run_e2e=$RUN_E2E shards=$SHARDS"
                  if [ "$CHANGES" != 'success' ]; then exit 1; fi
                  if [ "$RUN_E2E" != 'true' ] && [ "$SHARDS" = 'skipped' ]; then exit 0; fi
                  [ "$SHARDS" = 'success' ]

    # Fills master's caches whenever their keys can change, so the next PR starts warm.
    warm-cache:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true

            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(jq -r .version node_modules/playwright-core/package.json)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

            - name: Install Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: bunx playwright-core install --only-shell chromium
